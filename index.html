<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Principal</title>
</head>
<body>

    <!-- ENCABEZADO PRINCIPAL -->
    <header>
        <h1>Mi Plataforma de Gestión</h1>
        <p>Bienvenido al sistema</p>
    </header>

    <!-- SECCIÓN DE ESTADÍSTICAS -->
    <section>
        <h2>Estadísticas</h2>

        <div>
            <h3>Proyectos Totales</h3>
            <p>12</p>
        </div>

        <div>
            <h3>Tareas para hoy</h3>
            <p>5</p>
        </div>

        <div>
            <h3>Mensajes pendientes</h3>
            <p>3</p>
        </div>
    </section>

    <!-- SECCIÓN DE NOVEDADES -->
    <section>
        <h2>Novedades</h2>

        <ul>
            <li>María subió un archivo</li>
            <li>Se creó el proyecto "App Web"</li>
            <li>Juan completó una tarea</li>
            <li>Nuevo mensaje recibido</li>
        </ul>
        
    </section>
</body>
</html>
